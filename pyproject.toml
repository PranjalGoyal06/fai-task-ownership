[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fai-task-ownership"
version = "0.1.0"
description = "Deciding Task Ownership from Private Evidence Under Misaligned Incentives"
authors = [
    { name = "Pranjal Goyal" },
    { name = "Ujas Shah" },
    { name = "Harshal Kundanlal Rana" },
    { name = "Satyakam Mishra" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
